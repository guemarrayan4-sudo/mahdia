<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<title>لوحة التحكم · مهدية · الدليل الشامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1e3a8a;--navy-dark:#172554;--navy-light:#3b82f6;
  --gold:#c9a961;--gold-light:#e0c989;
  --bg:#f8fafc;--bg-soft:#f1f5f9;--card:#fff;
  --text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --sh:0 2px 12px rgba(15,23,42,.06);
  --sh-lg:0 12px 40px rgba(15,23,42,.1);
  --grad-navy:linear-gradient(135deg,#1e3a8a,#172554);
  --grad-gold:linear-gradient(135deg,#c9a961,#e0c989);
  --r:18px;--tr:.3s cubic-bezier(.4,0,.2,1);
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--navy);border-radius:10px}

/* ===== LOGIN ===== */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a 0%,#172554 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;transition:opacity .6s,visibility .6s;overflow:hidden}
.login.hide{opacity:0;visibility:hidden}
.login::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(201,169,97,.25) 0,transparent 50%),radial-gradient(circle at 80% 70%,rgba(59,130,246,.2) 0,transparent 50%);animation:floatBg 15s ease-in-out infinite}
@keyframes floatBg{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.1) rotate(5deg)}}
.login::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(201,169,97,.35) 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,.15) 1px,transparent 1px);background-size:50px 50px,80px 80px;background-position:0 0,40px 60px;animation:particles 20s linear infinite;opacity:.4}
@keyframes particles{0%{background-position:0 0,40px 60px}100%{background-position:50px 50px,120px 140px}}

.login-insta{position:absolute;top:24px;right:50%;transform:translateX(50%);display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25);padding:10px 22px;border-radius:50px;color:#fff;font-size:13px;font-weight:700;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.login-insta:hover{background:linear-gradient(135deg,#E4405F,#C13584);border-color:transparent;transform:translateX(50%) scale(1.05);box-shadow:0 12px 40px rgba(228,64,95,.5)}
.login-insta i{font-size:18px}
.login-insta .dot-live{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 12px #22c55e;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}

.login-box{background:rgba(255,255,255,.98);backdrop-filter:blur(30px);padding:45px 32px 38px;border-radius:32px;max-width:400px;width:100%;box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.9);text-align:center;position:relative;z-index:5;animation:loginEnter .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes loginEnter{0%{opacity:0;transform:translateY(40px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.login-box::before{content:'';position:absolute;top:0;left:20%;right:20%;height:4px;background:linear-gradient(90deg,transparent,#c9a961,transparent);border-radius:0 0 4px 4px;animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,100%{left:20%;right:20%;opacity:.5}50%{left:10%;right:10%;opacity:1}}

.login-logo{width:90px;height:90px;margin:0 auto 22px;background:linear-gradient(135deg,#c9a961 0%,#e0c989 50%,#c9a961 100%);background-size:200% 200%;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#1e3a8a;box-shadow:0 20px 40px rgba(201,169,97,.4),0 0 0 8px rgba(201,169,97,.15),inset 0 -4px 12px rgba(0,0,0,.1);animation:logoFloat 4s ease-in-out infinite,logoShine 3s linear infinite;position:relative}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes logoShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.login-logo::after{content:'';position:absolute;inset:-4px;border-radius:32px;border:2px solid transparent;background:linear-gradient(135deg,#c9a961,transparent,#c9a961) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rotateBorder 8s linear infinite}
@keyframes rotateBorder{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.login-box h1{font-size:26px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#1e3a8a 0%,#172554 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.login-box p{color:#64748b;font-size:13.5px;margin-bottom:28px;font-weight:600;letter-spacing:.3px}
.login-box p i{color:#c9a961;margin-left:6px}

.login-err{display:none;background:linear-gradient(135deg,#fee2e2,#fecaca);color:#dc2626;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:14px;border:1px solid rgba(220,38,38,.2);animation:shake .4s}
.login-err.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.inp-wrap{position:relative;margin-bottom:16px}
.inp-wrap i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#c9a961;font-size:18px;z-index:1;transition:all .3s}
.inp-wrap input{width:100%;padding:18px 50px 18px 18px;border:2px solid #e2e8f0;border-radius:16px;font-family:inherit;font-size:16px;font-weight:600;color:#0f172a;background:linear-gradient(135deg,#f8fafc 0%,#ffffff 100%);outline:none;transition:all .3s cubic-bezier(.4,0,.2,1);direction:ltr;text-align:center;letter-spacing:3px}
.inp-wrap input::placeholder{color:#94a3b8;letter-spacing:normal;font-weight:400}
.inp-wrap input:focus{border-color:#1e3a8a;background:#fff;box-shadow:0 0 0 5px rgba(30,58,138,.1),0 8px 20px rgba(30,58,138,.08);transform:translateY(-1px)}
.inp-wrap:focus-within i{color:#1e3a8a;transform:translateY(-50%) scale(1.15)}

.btn-login{width:100%;padding:18px;background:linear-gradient(135deg,#1e3a8a 0%,#172554 50%,#1e3a8a 100%);background-size:200% 200%;color:#fff;border-radius:16px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer;border:none;box-shadow:0 12px 30px rgba(30,58,138,.35),inset 0 -3px 0 rgba(0,0,0,.15);position:relative;overflow:hidden;letter-spacing:.5px}
.btn-login::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
.btn-login:hover::before{left:100%}
.btn-login:hover{background-position:100% 50%;box-shadow:0 16px 40px rgba(30,58,138,.5),inset 0 -3px 0 rgba(0,0,0,.15);transform:translateY(-2px)}
.btn-login:active{transform:translateY(0) scale(.98)}
.btn-login i{font-size:15px;transition:transform .3s}
.btn-login:hover i{transform:translateX(-4px)}

.login-footer{margin-top:24px;padding-top:20px;border-top:1px dashed #e2e8f0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;color:#94a3b8;font-weight:600}
.login-footer i{color:#c9a961;font-size:13px}

/* ===== HEADER ===== */
.hdr{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(15px)}
.hdr-brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:var(--navy)}
.hdr-brand i{color:var(--gold);font-size:20px}
.hdr-acts{display:flex;gap:7px}
.hdr-btn{width:38px;height:38px;border-radius:11px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:15px;transition:var(--tr);border:1px solid var(--line)}
.hdr-btn:active{transform:scale(.9)}
.hdr-btn.dgr{background:#fee2e2;color:#dc2626}
.hdr-btn.suc{background:#dcfce7;color:#16a34a}

/* ===== TABS ===== */
.tabs{display:flex;gap:6px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;background:var(--bg-soft);border:1.5px solid var(--line);border-radius:30px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;transition:var(--tr);color:var(--text)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 8px 20px rgba(30,58,138,.3)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 16px}
.st{background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--sh);border:1px solid var(--line);position:relative;overflow:hidden}
.st::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-navy)}
.st b{display:block;font-size:24px;font-weight:800;color:var(--navy);line-height:1}
.st span{display:block;font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}

/* ===== FORM ===== */
.form-card{margin:0 16px 16px;background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.form-card h2{font-size:16px;font-weight:900;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-card h2 i{color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row.full{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld label .req{color:#dc2626}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:13px;color:var(--text);background:var(--bg-soft);outline:none;transition:var(--tr)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(30,58,138,.08)}
.fld textarea{resize:vertical;min-height:55px}

.upload{border:2px dashed var(--line);border-radius:13px;padding:14px;text-align:center;cursor:pointer;transition:var(--tr);background:var(--bg-soft);display:block}
.upload:active{transform:scale(.98);border-color:var(--gold)}
.upload input{display:none}
.upload i{font-size:22px;color:var(--gold);margin-bottom:5px;display:block}
.upload p{font-size:12px;color:var(--muted);font-weight:600}

.prev-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.prev-img{width:66px;height:66px;border-radius:11px;object-fit:cover;border:2px solid var(--gold);padding:2px;background:#fff}

.form-btns{display:flex;gap:8px;margin-top:14px}
.btn-pri{flex:1;padding:13px;background:var(--navy);color:#fff;border-radius:13px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--tr)}
.btn-pri:active{transform:scale(.97);background:var(--navy-dark)}
.btn-can{padding:13px 20px;background:var(--bg-soft);border:1px solid var(--line);border-radius:13px;font-size:14px;font-weight:800;transition:var(--tr)}
.btn-can:active{transform:scale(.97)}

/* ===== LIST ===== */
.sec-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px}
.sec-bar h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec-bar h2 i{color:var(--gold)}
.list{padding:0 16px 100px;display:grid;gap:9px}
.item{background:var(--card);border-radius:14px;padding:11px 13px;box-shadow:var(--sh);border:1px solid var(--line);display:flex;align-items:center;gap:11px;transition:var(--tr)}
.item:active{transform:scale(.99)}
.item-icn{width:44px;height:44px;border-radius:13px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-info h3{font-size:14px;font-weight:800;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-info span{font-size:11px;color:var(--muted);font-weight:600}
.item-acts{display:flex;gap:5px;flex-shrink:0}
.icon-act{width:35px;height:35px;border-radius:10px;font-size:13px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.icon-act:active{transform:scale(.9)}
.icon-act.edit{background:rgba(201,169,97,.15);color:#a16207}
.icon-act.del{background:rgba(220,38,38,.15);color:#dc2626}

/* ===== GALLERY GRID ===== */
.gallery-grid{padding:0 16px 100px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal-card{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--sh);border:1px solid var(--line)}
.gal-card img{width:100%;height:100%;object-fit:cover}
.gal-del{position:absolute;top:8px;left:8px;width:34px;height:34px;background:rgba(220,38,38,.9);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;backdrop-filter:blur(6px);cursor:pointer;border:none;transition:var(--tr)}
.gal-del:active{transform:scale(.9)}

.empty{text-align:center;padding:55px 20px;color:var(--muted)}
.empty i{font-size:46px;color:var(--line);margin-bottom:12px}
.empty p{font-size:14px;font-weight:600}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(200px);background:var(--navy-dark);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:300;transition:.4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:#dc2626}
.toast.success{background:#16a34a}

/* ===== LOADING ===== */
.loading{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:500}
.loading.show{display:flex}
.spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.hidden{display:none!important}

@media(max-width:420px){
  .login-box{padding:38px 24px 30px;border-radius:26px}
  .login-logo{width:78px;height:78px;font-size:36px;margin-bottom:18px}
  .login-box h1{font-size:23px}
  .login-insta{top:16px;font-size:12px;padding:8px 18px}
}
@media(min-width:640px){
  .stats{max-width:600px;margin:0 auto}
  .form-card,.list,.gallery-grid{max-width:800px;margin-left:auto;margin-right:auto}
  .gallery-grid{grid-template-columns:repeat(3,1fr)}
  .tabs{max-width:800px;margin:0 auto}
}
</style>
</head>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login" id="loginScreen">
  <a class="login-insta" href="https://www.instagram.com/_rayan____7" target="_blank">
    <span class="dot-live"></span>
    <i class="fa-brands fa-instagram"></i>
    <span>@_rayan____7</span>

  <div class="login-box">
    <div class="login-logo"><i class="fa-solid fa-location-dot"></i></div>

<!-- ===== ADMIN PANEL ===== -->

              <option value="تعليم ثانوي">📚 تعليم ثانوي</option>
              <option value="تكوين">🧑‍🏫 تكوين</option>
              <option value="بريد">📮 بريد</option>
              <option value="اتصالات">📡 اتصالات</option>
              <option value="مطاعم">🍽️ مطاعم</option>
              <option value="مقاهي">☕ مقاهي</option>
              <option value="نقل">🚌 نقل</option>
              <option value="وقود">⛽ وقود</option>
              <option value="تجارة">🛒 تجارة</option>
              <option value="رياضة">⚽ رياضة</option>
              <option value="ثقافة">📖 ثقافة</option>

              <option value="خدمات">🛠️ خدمات</option>

              <option value="طوارئ">🚒 طوارئ</option>
              <option value="مخابز">🥖 مخابز</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="fld"><label>الأيقونة</label><input type="text" id="fIcon" value="📍"></div>
          <div class="fld"><label>نوع الصورة</label>
            <select id="fImgKey">
              <option value="admin">إدارة</option><option value="bank">بنك</option><option value="health">صحة</option>
              <option value="pharmacy">صيدلية</option><option value="mosque">مسجد</option><option value="school">مدرسة</option>
              <option value="post">بريد</option><option value="restaurant">مطعم</option><option value="cafe">مقهى</option>
              <option value="transport">نقل</option><option value="fuel">وقود</option><option value="market">سوق</option>
              <option value="sport">رياضة</option><option value="library">مكتبة</option><option value="park">حديقة</option>
              <option value="cemetery">مقبرة</option><option value="utility">خدمات</option>
              <option value="icecream">آيس كريم</option><option value="bakery">مخبز</option>
            </select>
          </div>
        </div>
        <div class="row full"><div class="fld"><label>الوصف <span class="req">*</span></label><textarea id="fDesc" required placeholder="وصف المكان..."></textarea></div></div>
        <div class="row">
          <div class="fld"><label>نص البحث <span class="req">*</span></label><input type="text" id="fQuery" required placeholder="BADR Mahdia Tiaret"></div>
          <div class="fld"><label>الإحداثيات <span class="req">*</span></label><input type="text" id="fCoords" value="35.43333,1.75" required dir="ltr"></div>
        </div>
        <div class="row full"><div class="fld"><label>رقم الهاتف</label><input type="tel" id="fPhone" placeholder="0550 123 456" dir="ltr"></div></div>
        <div class="row full"><div class="fld"><label>📤 صورة إضافية 1</label>
          <label class="upload"><input type="file" accept="image/*" id="fImg1File" onchange="prevImg(this,'prev1','fImg1')"><i class="fa-solid fa-cloud-arrow-up"></i><p>اضغط لاختيار صورة</p></label>
          <div class="prev-grid" id="prev1"></div><input type="hidden" id="fImg1">
        </div></div>
        <div class="row full"><div class="fld"><label>📤 صورة إضافية 2</label>
          <label class="upload"><input type="file" accept="image/*" id="fImg2File" onchange="prevImg(this,'prev2','fImg2')"><i class="fa-solid fa-cloud-arrow-up"></i><p>اضغط لاختيار صورة</p></label>
          <div class="prev-grid" id="prev2"></div><input type="hidden" id="fImg2">
        </div></div>
        <div class="form-btns">
          <button type="submit" class="btn-pri"><i class="fa-solid fa-floppy-disk"></i> <span id="submitText">إضافة</span></button>
          <button type="button" class="btn-can" onclick="clearForm()"><i class="fa-solid fa-eraser"></i></button>
        </div>
        <input type="hidden" id="editId">
      </form>
    </div>

    <div class="sec-bar"><h2><i class="fa-solid fa-list"></i> الأماكن (<span id="listCount">0</span>)</h2></div>
    <div class="list" id="list"></div>
  </div>

  <!-- TAB: GALLERY -->
  <div id="tab-gallery" class="hidden">
    <div class="form-card">
      <h2><i class="fa-regular fa-images"></i> إضافة صورة للمدينة</h2>
      <form id="galleryForm" onsubmit="submitGallery(event)">
        <div class="row full">
          <div class="fld">
            <label>📤 اختر صورة <span class="req">*</span></label>
            <label class="upload">
              <input type="file" accept="image/*" id="galFile" onchange="prevImg(this,'prevGal','galData')" required>
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <p>اضغط لاختيار صورة</p>
            </label>
            <div class="prev-grid" id="prevGal"></div>
            <input type="hidden" id="galData">
          </div>
        </div>
        <div class="row full">
          <div class="fld">
            <label>عنوان الصورة (اختياري)</label>
            <input type="text" id="galTitle" placeholder="مثل: منظر عام لمهدية">
          </div>
        </div>
        <div class="form-btns">
          <button type="submit" class="btn-pri"><i class="fa-solid fa-plus"></i> إضافة للمعرض</button>
        </div>
      </form>
    </div>

    <div class="sec-bar"><h2><i class="fa-regular fa-images"></i> صور المعرض (<span id="galCount">0</span>)</h2></div>
    <div class="gallery-grid" id="galleryList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>

<script>
// ============================================================
//  CONFIG - يمكنك تغيير كلمة المرور من هنا
// ============================================================
const SUPA_URL = 'https://cneqytgqfefpqhrmytdy.supabase.co';
const SUPA_KEY = 'sb_publishable_A_ncVEZMzhvf4YigdO29eA_0qjVgv-S';
const PASSWORD = '0674960988ggr2005'; // ← ✏️ غيّر كلمة السر من هنا

const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

let places = [];
let gallery = [];

function login(){
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('loginErr');
  if(pwd === PASSWORD){
    document.getElementById('loginScreen').classList.add('hide');
    document.getElementById('adminPanel').style.display = 'block';
    setTimeout(()=>document.getElementById('loginScreen').style.display='none',500);
    loadData();
    loadGalleryData();
    toast('✅ مرحباً بك');
  }else{
    err.classList.add('show');
    document.getElementById('pwd').value = '';
    setTimeout(()=>err.classList.remove('show'),3000);
  }
}

function logout(){if(confirm('هل تريد الخروج؟'))location.reload()}

function switchTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-places').classList.toggle('hidden', tab!=='places');
  document.getElementById('tab-gallery').classList.toggle('hidden', tab!=='gallery');
}

function showLoad(){document.getElementById('loading').classList.add('show')}
function hideLoad(){document.getElementById('loading').classList.remove('show')}

async function loadData(){
  try{
    showLoad();
    document.getElementById('stStatus').textContent = '⏳';
    const {data,error} = await supa.from('places').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    places = data || [];
    renderList();
    updateStats();
    document.getElementById('stStatus').textContent = '✅';
  }catch(e){
    console.error(e);
    document.getElementById('stStatus').textContent = '❌';
    toast('⚠️ فشل الاتصال','error');
  }finally{hideLoad()}
}

async function syncCloud(){await loadData();await loadGalleryData();toast('🔄 تم التحديث','success')}

function renderList(){
  document.getElementById('listCount').textContent = places.length;
  const list = document.getElementById('list');
  if(!places.length){
    list.innerHTML = `<div class="empty"><i class="fa-regular fa-folder-open"></i><p>لا توجد أماكن</p></div>`;
    return;
  }
  list.innerHTML = places.map(p=>`
    <div class="item">
      <div class="item-icn">${p.icon||'📍'}</div>
      <div class="item-info">
        <h3>${p.name}</h3>
        <span>${p.category}${p.phone?' · '+p.phone:''}</span>
      </div>
      <div class="item-acts">
        <button class="icon-act edit" onclick="editItem(${p.id})"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-act del" onclick="delItem(${p.id})"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  `).join('');
}

function updateStats(){
  document.getElementById('stTotal').textContent = places.length;
  document.getElementById('stCats').textContent = new Set(places.map(p=>p.category)).size;
}

function prevImg(input,prevId,hiddenId){
  const prev = document.getElementById(prevId);
  const hidden = document.getElementById(hiddenId);
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = e=>{
      prev.innerHTML = `<img class="prev-img" src="${e.target.result}">`;
      hidden.value = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function submitForm(e){
  e.preventDefault();
  const data = {
    name: document.getElementById('fName').value.trim(),
    category: document.getElementById('fCat').value,
    icon: document.getElementById('fIcon').value.trim() || '📍',
    description: document.getElementById('fDesc').value.trim(),
    search_query: document.getElementById('fQuery').value.trim(),
    img_key: document.getElementById('fImgKey').value,
    coords: document.getElementById('fCoords').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    image1: document.getElementById('fImg1').value,
    image2: document.getElementById('fImg2').value
  };
  if(!data.name || !data.category || !data.description || !data.search_query || !data.coords){
    toast('⚠️ املأ الحقول المطلوبة','error');return;
  }
  try{
    showLoad();
    const id = document.getElementById('editId').value;
    if(id){
      const {error} = await supa.from('places').update(data).eq('id',id);
      if(error) throw error;
      toast('✅ تم التحديث','success');
    }else{
      const {error} = await supa.from('places').insert(data);
      if(error) throw error;
      toast('✅ تم الإضافة','success');
    }
    clearForm();
    await loadData();
  }catch(e){console.error(e);toast('⚠️ '+e.message,'error')}
  finally{hideLoad()}
}

function editItem(id){
  const p = places.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fCat').value = p.category || '';
  document.getElementById('fIcon').value = p.icon || '📍';
  document.getElementById('fDesc').value = p.description || '';
  document.getElementById('fQuery').value = p.search_query || '';
  document.getElementById('fImgKey').value = p.img_key || 'admin';
  document.getElementById('fCoords').value = p.coords || '35.43333,1.75';
  document.getElementById('fPhone').value = p.phone || '';
  if(p.image1){document.getElementById('prev1').innerHTML = `<img class="prev-img" src="${p.image1}">`;document.getElementById('fImg1').value = p.image1}
  else{document.getElementById('prev1').innerHTML = '';document.getElementById('fImg1').value = ''}
  if(p.image2){document.getElementById('prev2').innerHTML = `<img class="prev-img" src="${p.image2}">`;document.getElementById('fImg2').value = p.image2}
  else{document.getElementById('prev2').innerHTML = '';document.getElementById('fImg2').value = ''}
  document.getElementById('editId').value = id;
  document.getElementById('formTitle').textContent = 'تعديل المكان';
  document.getElementById('submitText').textContent = 'حفظ';
  window.scrollTo({top:0,behavior:'smooth'});
  toast('✏️ '+p.name);
}

async function delItem(id){
  const p = places.find(x=>x.id===id);
  if(!p || !confirm(`حذف "${p.name}"؟`)) return;
  try{
    showLoad();
    const {error} = await supa.from('places').delete().eq('id',id);
    if(error) throw error;
    toast('🗑️ تم الحذف','success');
    await loadData();
  }catch(e){toast('⚠️ '+e.message,'error')}
  finally{hideLoad()}
}

function clearForm(){
  document.getElementById('form').reset();
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = 'إضافة مكان جديد';
  document.getElementById('submitText').textContent = 'إضافة';
  document.getElementById('fIcon').value = '📍';
  document.getElementById('fCoords').value = '35.43333,1.75';
  document.getElementById('prev1').innerHTML = '';
  document.getElementById('prev2').innerHTML = '';
  document.getElementById('fImg1').value = '';
  document.getElementById('fImg2').value = '';
}

async function loadGalleryData(){
  try{
    const {data,error} = await supa.from('gallery').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    gallery = data || [];
    renderGallery();
  }catch(e){
    console.error(e);
    gallery = [];
    renderGallery();
  }
}

function renderGallery(){
  document.getElementById('galCount').textContent = gallery.length;
  const list = document.getElementById('galleryList');
  if(!gallery.length){
    list.innerHTML = `<div class="empty" style="grid-column:1/-1;"><i class="fa-regular fa-images"></i><p>لا توجد صور في المعرض</p></div>`;
    return;
  }
  list.innerHTML = gallery.map(g=>`
    <div class="gal-card">
      <img src="${g.image_url}" alt="${g.title||'صورة'}" onerror="this.src='https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=400&q=80'">
      <button class="gal-del" onclick="delGallery('${g.id}')"><i class="fa-solid fa-trash"></i></button>
    </div>
  `).join('');
}

async function submitGallery(e){
  e.preventDefault();
  const imgData = document.getElementById('galData').value;
  const title = document.getElementById('galTitle').value.trim();
  if(!imgData){toast('⚠️ اختر صورة','error');return}
  try{
    showLoad();
    const {error} = await supa.from('gallery').insert({image_url: imgData, title: title});
    if(error) throw error;
    toast('✅ تم إضافة الصورة','success');
    document.getElementById('galleryForm').reset();
    document.getElementById('prevGal').innerHTML = '';
    document.getElementById('galData').value = '';
    await loadGalleryData();
  }catch(e){
    console.error(e);
    toast('⚠️ '+e.message,'error');
  }finally{hideLoad()}
}

async function delGallery(id){
  if(!confirm('حذف هذه الصورة؟')) return;
  try{
    showLoad();
    const {error} = await supa.from('gallery').delete().eq('id',id);
    if(error) throw error;
    toast('🗑️ تم الحذف','success');
    await loadGalleryData();
  }catch(e){toast('⚠️ '+e.message,'error')}
  finally{hideLoad()}
}

function toast(m,type=''){
  const t = document.getElementById('toast');
  t.textContent = m;
  t.className = 'toast '+type;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
